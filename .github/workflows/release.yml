name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign, and Notarize
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Sign App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Update version in project.yml and regenerate
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/DEVELOPMENT_TEAM: \".*\"/DEVELOPMENT_TEAM: \"$APPLE_TEAM_ID\"/" project.yml
          xcodegen generate

          # Build the app (signing settings come from project.yml)
          xcodebuild -project MermaidViewer.xcodeproj \
            -scheme MermaidViewer \
            -configuration Release \
            -derivedDataPath build \
            build \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

          # Copy app to dist
          mkdir -p dist
          cp -R "build/Build/Products/Release/MermaidViewer.app" "dist/MermaidViewer.app"

          # Verify signing
          codesign --verify --deep --strict --verbose=2 "dist/MermaidViewer.app" 2>&1 || true

          echo "Build and sign complete"

      - name: Notarize App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="dist/MermaidViewer.app"

          # Create zip for notarization
          ditto -c -k --keepParent "$APP_PATH" dist/app.zip

          # Submit for notarization
          xcrun notarytool submit dist/app.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the ticket
          xcrun stapler staple "$APP_PATH"

      - name: Create DMG
        env:
          CODE_SIGN_IDENTITY: "Developer ID Application: James Campbell (529AKJCKRC)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="MermaidViewer-${VERSION}.dmg"

          # Create DMG
          hdiutil create -volname "Mermaid Viewer" \
            -srcfolder "dist/MermaidViewer.app" \
            -ov \
            -format UDZO \
            "dist/${DMG_NAME}"

          # Sign DMG
          codesign --force --sign "$CODE_SIGN_IDENTITY" "dist/${DMG_NAME}"

          # Notarize DMG
          xcrun notarytool submit "dist/${DMG_NAME}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple DMG
          xcrun stapler staple "dist/${DMG_NAME}"

          # Generate checksum
          shasum -a 256 "dist/${DMG_NAME}" > "dist/${DMG_NAME}.sha256"

          echo "DMG_NAME=${DMG_NAME}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true